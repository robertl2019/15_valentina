<title>Danna Valentina 15</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap">

<style>
  /* Layout: centered single column, elegant vertical rhythm */
  :root {
    --bg: #fdf6f9;
    --bg2: #f7edf4;
    --fg: #3a2535;
    --fg-soft: #7a5e72;
    --rose: #d4879f;
    --lila: #a07ab8;
    --lila-soft: #c9b0dc;
    --rose-soft: #eec5d5;
    --gold: #c9a96e;
    --border: rgba(160, 122, 184, 0.2);

    --font-display: 'Cormorant Garamond', 'Georgia', serif;
    --font-body: 'Jost', 'Helvetica Neue', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a0f17;
      --bg2: #231529;
      --fg: #f0e4ec;
      --fg-soft: #c0a0b8;
      --rose: #d4879f;
      --lila: #b08ccb;
      --lila-soft: #7a5e8f;
      --rose-soft: #6e3d52;
      --border: rgba(192, 160, 216, 0.2);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1a0f17;
    --bg2: #231529;
    --fg: #f0e4ec;
    --fg-soft: #c0a0b8;
    --rose: #d4879f;
    --lila: #b08ccb;
    --lila-soft: #7a5e8f;
    --rose-soft: #6e3d52;
    --border: rgba(192, 160, 216, 0.2);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* Decorative background petals */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 10% 20%, rgba(212,135,159,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 90% 80%, rgba(160,122,184,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(201,169,110,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    max-width: 420px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Top ornament */
  .ornament {
    font-family: var(--font-display);
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    line-height: 1;
    opacity: 0.85;
  }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--lila);
    margin-bottom: 20px;
  }

  .divider {
    width: 80px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--lila-soft), transparent);
    margin: 0 auto 28px;
  }

  .name {
    font-family: var(--font-display);
    font-size: clamp(2.8rem, 10vw, 3.8rem);
    font-weight: 300;
    font-style: italic;
    line-height: 1.05;
    color: var(--fg);
    text-wrap: balance;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  .name em {
    font-style: normal;
    color: var(--rose);
  }

  .age-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0 28px;
  }

  .age-line {
    width: 32px;
    height: 1px;
    background: var(--lila-soft);
  }

  .age-text {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 300;
    color: var(--lila);
    letter-spacing: 0.05em;
  }

  .coming-soon-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    margin-bottom: 28px;
  }

  .coming-soon-box h2 {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 300;
    font-style: italic;
    color: var(--fg);
    margin: 0 0 10px;
    text-wrap: balance;
  }

  .coming-soon-box p {
    font-size: 0.88rem;
    color: var(--fg-soft);
    margin: 0;
    line-height: 1.65;
  }

  .date-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--rose-soft), var(--lila-soft));
    border-radius: 100px;
    padding: 10px 22px;
    margin-bottom: 28px;
  }

  .date-pill span {
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg);
  }

  .date-icon {
    font-size: 0.9rem;
  }

  .footer-note {
    font-size: 0.75rem;
    color: var(--fg-soft);
    letter-spacing: 0.05em;
    opacity: 0.7;
  }

  /* Floating petals decoration */
  .petal {
    position: fixed;
    width: 8px;
    height: 12px;
    border-radius: 50% 50% 50% 0;
    opacity: 0.15;
    animation: float linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes float {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10% { opacity: 0.15; }
    90% { opacity: 0.1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .petal { display: none; }
  }
</style>

<div class="card">
  <div class="ornament">✦</div>
  <div class="eyebrow">Una noche para recordar</div>
  <div class="divider"></div>

  <h1 class="name">Danna<br><em>Valentina</em></h1>

  <div class="age-badge">
    <div class="age-line"></div>
    <div class="age-text">XV Años</div>
    <div class="age-line"></div>
  </div>

  <div class="coming-soon-box">
    <h2>¡Muy pronto!</h2>
    <p>Aquí podrás subir y ver todas las fotos y videos de esta noche especial. Solo escanea este código QR el día del evento.</p>
  </div>

  <div class="date-pill">
    <span class="date-icon">🌸</span>
    <span>17 · Octubre · 2026</span>
  </div>

  <div class="footer-note">Forero</div>
</div>

<script>
  // Floating petals
  const colors = ['#d4879f', '#a07ab8', '#c9b0dc', '#eec5d5'];
  function createPetal() {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    p.style.width = (6 + Math.random() * 6) + 'px';
    p.style.height = (8 + Math.random() * 8) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 20000);
  }

  // Only create petals if reduced motion not preferred
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(createPetal, 1200);
    for (let i = 0; i < 6; i++) setTimeout(createPetal, i * 300);
  }
</script>
